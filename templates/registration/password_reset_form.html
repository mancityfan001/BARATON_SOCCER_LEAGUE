<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Baraton Soccer League</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .reset-box {
            background: white;
            width: 380px;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: #006b3c;
        }

        p {
            color: #555;
            line-height: 1.5;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 4px;
            background: #006b3c;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #00502d;
        }
    </style>
</head>

<body>

<div class="reset-box">

    <h2>Forgot Password?</h2>

    <p>
        Enter the email address associated with your account.
        We will send you instructions for resetting your password.
    </p>

    <form method="post">
        {% csrf_token %}

        {{ form.email.errors }}

        <label for="{{ form.email.id_for_label }}">
            Email address
        </label>

        {{ form.email }}

        <button type="submit">
            Send Reset Link
        </button>
    </form>

</div>

</body>
</html>
