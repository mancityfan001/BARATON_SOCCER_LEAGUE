        .message-box {

        }

            margin-top: 15px;
            padding: 11px 20px;

            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>

<body>

<div class="message-box">

    <h2>Check Your Email</h2>

    <p>
        If an account exists with the email address you entered,
